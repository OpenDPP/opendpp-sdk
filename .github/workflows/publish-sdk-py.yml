name: Publish opendpp-sdk (Python)

# Publishes opendpp-sdk to PyPI (keyless — OIDC trusted publishing, no API token) when a
# `sdk-py-<semver>` tag is pushed. The tag must match python/pyproject.toml's version, whose
# major.minor is version-locked to the OpenDPP API contract (openapi.json info.version) — the patch
# digit is the SDK-only fix lane (scripts/check_version_lock.py). Trusted Publisher: PyPI org
# `opendpp`, repo OpenDPP/opendpp-sdk, workflow publish-sdk-py.yml, environment release; the repo's
# `release` environment also carries a `sdk-py-*` deployment tag rule. Unlike npm's bootstrap-token
# first release, PyPI's *pending publisher* makes this lane keyless from its very first release.

on:
  push:
    tags:
      - "sdk-py-*" # e.g. sdk-py-1.14.0
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC — the PyPI trusted-publishing anchor

concurrency:
  group: publish-sdk-py
  cancel-in-progress: false

jobs:
  publish:
    name: PyPI publish opendpp-sdk
    runs-on: ubuntu-latest
    environment: release # must match the PyPI Trusted Publisher config
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # The generator needs a JRE (the drift guard regenerates); node + python3 are preinstalled on
      # ubuntu-latest (the normalizer and the build/test steps use them, same as the java job's
      # version-lock step relies on the preinstalled node).
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/sdk-py-')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#sdk-py-}"
          PKG_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies $TAG_VERSION but pyproject.toml is $PKG_VERSION"
            exit 1
          fi

      - name: Drift + version guard — publish only spec-faithful, version-locked output
        run: |
          ./scripts/regenerate.sh
          if [ -n "$(git status --porcelain -- opendpp_sdk)" ]; then
            echo "::error::python/opendpp_sdk drifted from openapi.json — run \`./scripts/regenerate.sh\` and commit."
            git --no-pager status --porcelain -- opendpp_sdk
            exit 1
          fi
          python3 scripts/check_version_lock.py

      - name: Build (wheel + sdist)
        run: |
          python3 -m pip install --upgrade build
          python3 -m build

      - name: Test
        run: |
          python3 -m pip install -e . pytest
          python3 -m pytest tests/

      - name: Publish (keyless via OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/dist/
